[alembic]
script_location = alembic
prepend_sys_path = .
# Renamed from version_path_separator in Alembic 1.16; it now governs
# prepend_sys_path as well. prepend_sys_path is a single entry ('.'),
# so every splitting rule yields the same result and this is a no-op
# beyond silencing the deprecation warning.
path_separator = os

sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
